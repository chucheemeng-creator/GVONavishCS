# 發佈新版：在 Actions 頁面選「發佈新版」→ Run workflow → 選要發佈的程式。
# 發佈前先改好兩個地方、一起合併到 master：
#   - <程式>/<程式>.csproj 的 <Version>
#   - <程式>/ReleaseNotes.md：這一版的說明，裡面的 <!-- version: … --> 要和 <Version> 一樣
# 執行時：
# 1. 從 .csproj 讀版本號；同一個版本已經有 Release 時停下來
# 2. 檢查 ReleaseNotes.md 的版本號（忘了改說明時停下來，免得發出上一版的說明）
# 3. 跑全部的測試，沒過就不發佈
# 4. 用平常的設定發佈：win-x64、不含 .NET 執行環境（framework-dependent）、單一檔案、不用 ReadyToRun
# 5. 壓成 zip，直接發佈 Release（標籤、標題、說明、zip；發現物同步標成 Pre-release）
# 想先看過再發佈：勾「只建立草稿」，之後到 Releases 頁面檢查、按 Publish。
name: 發佈新版

on:
  workflow_dispatch:
    inputs:
      project:
        description: 要發佈的程式
        type: choice
        options:
          - GVODiscoverySync
          - GVONavish
        default: GVODiscoverySync
      draft:
        description: 只建立草稿（之後自己到 Releases 頁面按 Publish）
        type: boolean
        default: false

permissions:
  contents: write # 建立 Release 要用

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 讀版本號、決定檔名
        id: info
        shell: pwsh
        run: |
          $project = '${{ inputs.project }}'
          [xml]$csproj = Get-Content "$project/$project.csproj" -Encoding UTF8
          $version = @($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if (-not $version) { throw "$project.csproj 裡找不到 <Version>" }
          if ($project -eq 'GVONavish') {
            $tag = "Navish-v$version"
            $title = "GVONavishCS v$version"
            $zip = "GVONavish-v$version-win-x64.zip"
            $prerelease = 'false'
          } else {
            $tag = "DiscoverySync-v$version"
            $title = "發現物同步 GVODiscoverySync v$version"
            $zip = "GVODiscoverySync-v$version.zip"
            $prerelease = 'true'
          }
          # 同一個版本已經發佈過（或已經有草稿）：多半是忘了改版本號
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "$tag 已經有 Release（或草稿）了，請先把 $project.csproj 的 <Version> 改成新版本號" }
          $global:LASTEXITCODE = 0

          # 這一版的說明：ReleaseNotes.md 的版本號要和 .csproj 一樣；拿掉開頭的註解（說明、版本號）
          $notesPath = "$project/ReleaseNotes.md"
          if (-not (Test-Path $notesPath)) { throw "找不到 $notesPath（這一版的說明）" }
          $notes = Get-Content $notesPath -Raw -Encoding UTF8
          if ($notes -notmatch '<!--\s*version:\s*([^\s]+)\s*-->') { throw "$notesPath 裡找不到 <!-- version: … -->" }
          if ($Matches[1] -ne $version) {
            throw "$notesPath 的版本號是 $($Matches[1])，$project.csproj 是 $version：請先把這一版的說明寫好（並改版本號）"
          }
          $body = ($notes -replace '(?s)^\s*(<!--.*?-->\s*)+', '').Trim()
          Set-Content release-notes.md $body -Encoding UTF8
          "project=$project" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "發佈 $title（標籤 $tag，檔案 $zip）"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 測試
        run: dotnet test GVONavishCS.slnx -c Release

      - name: 發佈
        run: >
          dotnet publish ${{ steps.info.outputs.project }}/${{ steps.info.outputs.project }}.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None
          -o publish

      - name: 壓縮
        shell: pwsh
        run: |
          # 只放執行需要的檔案（exe，GVONavish 另外有地圖和航線資料）
          $files = Get-ChildItem publish -File | Where-Object { $_.Extension -in '.exe', '.png', '.bin' }
          $files | ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length / 1KB)) KB" }
          Compress-Archive -Path $files.FullName -DestinationPath '${{ steps.info.outputs.zip }}'

      - name: 發佈 Release
        shell: pwsh
        run: |
          $ghArgs = @(
            'release', 'create', '${{ steps.info.outputs.tag }}', '${{ steps.info.outputs.zip }}',
            '--target', '${{ github.sha }}',
            '--title', '${{ steps.info.outputs.title }}',
            '--notes-file', 'release-notes.md'
          )
          if ('${{ steps.info.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          if ('${{ inputs.draft }}' -eq 'true') { $ghArgs += '--draft' }
          gh @ghArgs
        env:
          GH_TOKEN: ${{ github.token }}
